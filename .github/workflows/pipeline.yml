name: Ma Premiere CI

on:
  push:
    branches: [ "main" ]

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lancer le test
        run: python test_calcul.py