name: Ma Premiere CI

on:
  push:
    branches: [ "main" ]

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # On ajoute l'outil officiel de test
      - name: Installer pytest
        run: pip install pytest

      # On demande à pytest de lancer notre fichier de test
      - name: Lancer le test avec pytest
        run: pytest test_calcul.py